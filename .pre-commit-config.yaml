repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/assets/vendor/|norris-site/vendor/|\.opencode/)
      - id: end-of-file-fixer
        exclude: ^(docs/assets/vendor/|norris-site/vendor/|\.opencode/)
  - repo: local
    hooks:
      - id: check-lengths
        name: file-length gate (BLOCK >500)
        entry: python check_lengths.py
        language: system
        pass_filenames: false
